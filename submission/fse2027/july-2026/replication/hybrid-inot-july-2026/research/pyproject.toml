[project]
name = "hybrid-inot-research"
version = "0.1.0"
description = "Empirical validation of Hybrid-INoT architecture vs Classical-MAS for software engineering tasks with long shared context"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "tiktoken>=0.7.0",
    "datasets>=2.20.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "tenacity>=8.5.0",
    "radon>=6.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

[project.scripts]
inot = "inot.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
