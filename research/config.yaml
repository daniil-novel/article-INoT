# Default experimental configuration. Overridable per-experiment via CLI.
# All numeric defaults are taken from the article (Anonymous authors, 2026):
#   K=3, I=3 base configuration; lambda=0.5; delta_H1=0.15;
#   tau_route_star=1024; seeds={42,123,456,789,1337}.

llm:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  # The "large" and "small" models referenced in the article (rL, rS).
  # Defaults chosen as common cheap+strong combo. Override freely.
  large_model: google/gemini-3.1-pro-preview
  small_model: google/gemini-3.1-flash-lite
  # OpenRouter prices ($ per 1M tokens) snapshot. Update via `--prices-file`.
  prices_usd_per_mtok:
    openai/gpt-4o-2024-11-20:        {input: 2.50, output: 10.00}
    openai/gpt-4o-mini-2024-07-18:   {input: 0.15, output: 0.60}
    anthropic/claude-3.5-sonnet:     {input: 3.00, output: 15.00}
    anthropic/claude-3-haiku:        {input: 0.25, output: 1.25}
    google/gemini-3.1-pro-preview:   {input: 2.00, output: 12.00}
    google/gemini-3.1-flash-lite:    {input: 0.25, output: 1.50}
  request_timeout_seconds: 120
  max_retries: 4
  temperature: 0.2
  # Budget guard: hard cap in USD per single experiment run; raises if exceeded.
  hard_budget_usd: 10.0

accounting:
  # Fixed conversion rate for reproducible reports. Update manually before
  # a run if you need a fresh RUB estimate; raw scientific accounting stays USD.
  usd_to_rub: 100.0
  currency_note: "Manual fixed rate for reproducible experiment reports"

architectures:
  K: 3              # candidates per inner iteration (rwork output cardinality)
  I: 3              # max iterations (inner loop / external pipeline)
  R: 1              # selective rerun budget
  M: 3              # candidates promoted to ExternalVerify
  stagnation_eps: 0.02

routing:
  tau_route_star_tokens: 1024
  enable: true

compression:
  tau_len_tokens: 4096
  enable: true

metrics:
  lambda_maintainability: 0.5
  weights_M:
    cc:   0.35
    dup:  0.25
    warn: 0.20
    doc:  0.20

statistics:
  alpha: 0.05
  bootstrap_resamples: 10000
  holm_bonferroni: true
  ci_level: 0.95

experiments:
  default_seeds: [42, 123, 456, 789, 1337]
  e1_humaneval_n: 164          # full HumanEval; override with --n for pilot
  e1_context_lengths: [512, 2048, 8192]
  h1_context_threshold_tokens: 2048
  e3_context_lengths: [256, 1024, 4096, 16384]
  e3_humaneval_n: 50
  e4_humaneval_n: 100
  e4_swebench_n: 50
  e5_total_n: 500
  e5_extrapolate_to: 10000
  e6_context_lengths: [512, 2048, 8192]
  delta_H1: 0.15
  pass_at_1_tolerance_pp: 2.0
