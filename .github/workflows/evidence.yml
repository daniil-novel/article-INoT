name: Evidence integrity and replay

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: reproducibility/requirements-publication.txt
      - name: Install recorded analysis dependencies
        run: python -m pip install -r reproducibility/requirements-publication.txt
      - name: Test audit and analysis software
        run: python -m pytest reproducibility/tests -q
      - name: Verify every published evidence byte
        run: |
          python - <<'PY'
          from pathlib import Path
          from reproducibility.evidence_manifest import verify
          manifests = sorted(Path('reproducibility/results').glob('*/EVIDENCE_MANIFEST.json'))
          assert manifests, 'No evidence inventories found'
          for manifest in manifests:
              print(manifest.parent.name, verify(manifest.parent))
          PY
      - name: Replay development outcomes without model calls or Docker
        run: |
          python -m reproducibility.assemble_scale collect \
            --archive reproducibility/results/20260908_codex_mini_dev40/generation \
            --predictions reproducibility/results/20260908_codex_mini_dev40/predictions \
            --native reproducibility/results/20260908_codex_mini_dev40/evaluations \
            --controls reproducibility/results/20260908_codex_mini_dev40/controls/attempt3 \
            --output tmp/ci-development-replay
          python - <<'PY'
          from pathlib import Path
          actual = Path('tmp/ci-development-replay')
          expected = Path('reproducibility/results/20260908_codex_mini_dev40/analysis')
          for name in ('summary.json', 'candidate_records.jsonl'):
              assert (actual/name).read_bytes() == (expected/name).read_bytes(), name
          print('Published development summary and all 400 candidate records replay exactly')
          PY
      - name: Replay INoT outcomes without model calls or Docker
        run: |
          python -m reproducibility.heldout200.inot_evidence collect \
            --original reproducibility/results/20260908_codex_mini_inot200/generation/codex-inot200-v1 \
            --continuation reproducibility/results/20260908_codex_mini_inot200/generation/codex-inot200-continuation-v1 \
            --tasks reproducibility/results/20260908_codex_mini_heldout200/controls/attempt2/input/prepared.jsonl \
            --selection reproducibility/results/20260908_codex_mini_inot200/protocols/heldout200_selection.json \
            --gate reproducibility/results/20260908_codex_mini_heldout200/controls/attempt3/heldout200_control_gate.json \
            --protocol reproducibility/results/20260908_codex_mini_inot200/protocols/INOT_PROTOCOL.md \
            --predictions reproducibility/results/20260908_codex_mini_inot200/predictions \
            --native reproducibility/results/20260908_codex_mini_inot200/evaluation \
            --controls reproducibility/results/20260908_codex_mini_heldout200/controls/attempt3 \
            --output tmp/ci-inot-replay
          python - <<'PY'
          from pathlib import Path
          actual = Path('tmp/ci-inot-replay')
          expected = Path('reproducibility/results/20260908_codex_mini_inot200/analysis')
          for name in ('summary.json', 'candidate_records.jsonl'):
              assert (actual/name).read_bytes() == (expected/name).read_bytes(), name
          print('Published INoT summary and all 199 candidate records replay exactly')
          PY
      - name: Recheck the two real SWE patch outcomes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from reproducibility.benchmark_bridge import _extract_fenced_block
          from reproducibility.codex_subscription import parse_events
          from reproducibility.swe_smoke.evaluate_predictions import load_prediction, sha256, validate_join
          root = Path('reproducibility/results/20260908_codex_mini_swe_dev1')
          rows = [json.loads(line) for line in (root/'generation/results.jsonl').read_text(encoding='utf-8').splitlines()]
          expected = json.loads((root/'evaluations/analysis.json').read_text(encoding='utf-8'))
          assert len(rows) == expected['observed_candidate_files'] == 2
          for row in rows:
              name = f"{row['arm']}--r{row['replicate_id']}"
              folder = root/'evaluations'/name
              native = json.loads((folder/'provenance.json').read_text(encoding='utf-8'))
              parsed = parse_events((root/'generation/turns'/f"{row['id']}-0"/'events.jsonl').read_bytes())
              assert parsed['final_text'] == row['final_text']
              program, extracted = _extract_fenced_block(row['final_text'], 'swebench')
              prediction = load_prediction(folder/'input/predictions.jsonl')
              assert extracted and program == prediction['model_patch']
              assert native['launcher_exit_code'] == 0 and native['prediction_bytes_unchanged']
              assert sha256(folder/'input/predictions.jsonl') == native['prediction_snapshot_sha256']
              assert sha256(root/'input/dev_custom_image.json') == native['dataset_sha256']
              report_dir = folder/'logs/evaluation'/native['run_id']
              actual = validate_join(report_dir, prediction['instance_id'], prediction['model_name_or_path'], program, False)
              saved = json.loads((folder/'join_validation.json').read_text(encoding='utf-8'))
              for key in saved:
                  if key != 'prediction_to_report_join':
                      assert actual[key] == saved[key], (name, key)
              assert actual['status'] == 'complete'
              print(name, actual['classification'])
          PY
