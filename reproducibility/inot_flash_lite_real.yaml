# Reproducible low-cost profile used for the article evidence refresh.
# Research code: https://github.com/daniil-novel/INoT_Research
# Source revision checked on 2026-07-26:
# 010211ee5775185e8330ab6cde06e912c2adcb9e

llm:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  large_model: google/gemini-3.1-flash-lite
  small_model: google/gemini-3.1-flash-lite
  prices_usd_per_mtok:
    google/gemini-3.1-flash-lite: {input: 0.25, output: 1.50}
  request_timeout_seconds: 120
  max_retries: 4
  temperature: 0.2
  hard_budget_usd: 10.0

accounting:
  usd_to_rub: 100.0
  currency_note: "Fixed rate used only for reproducible local conversion"

architectures:
  K: 3
  I: 3
  R: 1
  M: 3
  stagnation_eps: 0.02

routing:
  tau_route_star_tokens: 1024
  enable: true

compression:
  tau_len_tokens: 4096
  enable: true

metrics:
  lambda_maintainability: 0.5
  weights_M:
    cc: 0.35
    dup: 0.25
    warn: 0.20
    doc: 0.20

statistics:
  alpha: 0.05
  bootstrap_resamples: 10000
  holm_bonferroni: true
  ci_level: 0.95

experiments:
  default_seeds: [42]
  e1_humaneval_n: 20
  e1_context_lengths: [512, 2048, 8192]
  h1_context_threshold_tokens: 2048
  e3_context_lengths: [256, 1024, 4096, 16384]
  e3_humaneval_n: 20
  e4_humaneval_n: 20
  e4_swebench_n: 20
  e5_total_n: 21
  e5_extrapolate_to: 10000
  e6_context_lengths: [512, 2048, 8192]
  delta_H1: 0.15
  pass_at_1_tolerance_pp: 2.0
